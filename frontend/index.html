<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F0E8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="description" content="Real-time brand risk and sentiment intelligence for Instagram, YouTube and the news." />
    <meta property="og:title" content="BrandShield AI" />
    <meta property="og:description" content="Know when people turn on your brand, before it trends." />
    <meta property="og:image" content="/brand/brandshield-social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('brandshield-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>BrandShield AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
